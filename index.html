<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bouncing Ball Game</h1>
        
        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        
        <!-- Game Info Display -->
        <div class="game-info">
            <div class="score-display">
                <span>Score: </span>
                <span id="score">0</span>
            </div>
            <div class="level-display">
                <span>Level: </span>
                <span id="level">1</span>
            </div>
        </div>
        
        <!-- Control Buttons -->
        <div class="controls">
            <button id="startBtn" class="btn">Start Game</button>
            <button id="restartBtn" class="btn" style="display: none;">Restart</button>
        </div>
        
        <!-- Instructions -->
        <div class="instructions">
            <h3>How to Play:</h3>
            <p>← → Arrow keys to move the paddle</p>
            <p>Keep the ball from falling below the paddle</p>
            <p>Score increases with each paddle hit</p>
            <p>Game gets faster as you progress!</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
